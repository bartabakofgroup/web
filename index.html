<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BDR holding — Připravujeme se</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="images/BDR holding logo white.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #08111f;
      color: #f0ede8;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex; flex-direction: column;
      min-height: 100vh;
      position: relative; overflow-x: hidden;
    }

    /* grid background */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(184,151,90,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184,151,90,.07) 1px, transparent 1px);
      background-size: 72px 72px;
    }

    /* radial glow */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 60% at 80% 20%, rgba(17,34,64,.95) 0%, transparent 65%),
        radial-gradient(ellipse 50% 50% at 15% 85%, rgba(184,151,90,.05) 0%, transparent 60%);
    }

    /* ── MAIN ────────────────────────────────────────────── */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 40px;
      position: relative; z-index: 1;
      text-align: center;
    }

    .logo {
      height: 56px; margin-bottom: 64px;
      opacity: .92;
    }

    .label {
      font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
      color: #b8975a; margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 60px);
      font-weight: 400; line-height: 1.2;
      letter-spacing: -.01em;
      margin-bottom: 24px;
    }

    h1 em { font-style: italic; color: #d4af70; }

    .sub {
      font-size: 16px; color: #8a9ab5; line-height: 1.8;
      max-width: 480px; margin: 0 auto 64px;
    }

    /* gold divider */
    .line {
      width: 48px; height: 1px; background: #b8975a;
      margin: 0 auto 64px;
    }

    /* company list */
    .companies {
      display: flex; gap: 2px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 72px;
    }

    .company {
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 48px;
      background: rgba(17,34,64,.6);
      border: 1px solid rgba(184,151,90,.15);
      min-width: 200px;
      text-decoration: none;
      transition: border-color .3s, background .3s;
    }

    .company:hover {
      border-color: rgba(184,151,90,.35);
      background: rgba(17,34,64,.85);
    }

    .company img {
      height: 32px; width: auto; max-width: 140px;
      object-fit: contain; margin-bottom: 16px;
      opacity: .85;
    }

    .company span {
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: #8a9ab5;
    }

    /* contact */
    .contact {
      font-size: 14px; color: #8a9ab5; line-height: 1.9;
    }

    .contact a {
      color: #d4af70; text-decoration: none;
      border-bottom: 1px solid rgba(212,175,112,.3);
      transition: border-color .25s, color .25s;
    }

    .contact a:hover {
      color: #f0ede8;
      border-color: rgba(240,237,232,.4);
    }

    /* ── FOOTER ──────────────────────────────────────────── */
    footer {
      position: relative; z-index: 1;
      padding: 24px 40px;
      border-top: 1px solid rgba(184,151,90,.1);
      display: flex; justify-content: center; align-items: center; gap: 24px;
    }

    footer p {
      font-size: 11px; letter-spacing: .08em;
      color: rgba(240,237,232,.28);
    }

    footer a {
      color: rgba(240,237,232,.28); transition: color .25s;
    }
    footer a:hover { color: rgba(240,237,232,.6); }

    @media (max-width: 640px) {
      .companies { flex-direction: column; align-items: center; }
      .company { width: 100%; max-width: 300px; }
    }
  </style>
</head>
<body>

  <main>
    <img class="logo" src="images/BDR holding logo white.png" alt="BDR Holding" />

    <p class="label">Již brzy</p>

    <h1>Připravujeme<br/><em>nové stránky</em></h1>

    <p class="sub">Web BDR holding a stránky společností skupiny jsou ve výstavbě. Brzy se vrátíme.</p>

    <div class="line"></div>

    <div class="companies">
      <a class="company" href="https://www.bakofgroup.cz" target="_blank" rel="noopener">
        <img src="images/Bakof logo 1 white.png" alt="Bakof Group" />
        <span>bakofgroup.cz</span>
      </a>
      <a class="company" href="https://www.boint.cz" target="_blank" rel="noopener">
        <img src="images/Boint logo 1 white.png" alt="Boint" />
        <span>boint.cz</span>
      </a>
      <a class="company" href="https://www.olejnik.cz" target="_blank" rel="noopener">
        <img src="images/Olejník logo 01.png" alt="Olejník" style="filter: brightness(0) invert(1);" />
        <span>olejnik.cz</span>
      </a>
    </div>

    <div class="contact">
      <p>Navštivte náš <a href="https://www.linkedin.com/in/dalibor-bárta-3489a081/" target="_blank" rel="noopener">LinkedIn</a></p>
    </div>
  </main>

  <footer>
    <p>© 2025 BDR Holding</p>
    <a href="https://www.linkedin.com/in/dalibor-bárta-3489a081/" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
    </a>
  </footer>

</body>
</html>
